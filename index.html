<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 【修改点 1】：在这里修改你的浏览器标签页标题与简介 -->
    <title>GEEK // RESEARCH & NOTES</title>
    <meta name="description" content="Personal Research Homepage and LaTeX Notes">
    
    <!-- 引入 Google Fonts 极客等宽字体 -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,500;0,700;1,400&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- 引入 KaTeX (极速 LaTeX 渲染引擎) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- 引入 Marked.js 与 Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(16, 20, 30, 0.78);
            --border-glow: rgba(0, 240, 255, 0.25);
            --accent-cyan: #00f0ff;
            --accent-purple: #bd00ff;
            --accent-green: #00ff66;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow-x: hidden;
            line-height: 1.7;
        }

        #cyber-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* 首屏布局与终端窗口 */
        .hero {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        .terminal-box {
            width: 100%;
            max-width: 720px;
            background: rgba(10, 14, 22, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 240, 255, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .terminal-header {
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .terminal-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px; height: 12px;
            border-radius: 50%;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .terminal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0 auto;
            transform: translateX(-18px);
        }

        .terminal-body {
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .terminal-output {
            color: var(--text-muted);
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .terminal-output .highlight-cmd { color: var(--accent-cyan); }
        .terminal-output .highlight-success { color: var(--accent-green); }
        .terminal-output .highlight-warn { color: #ffbd2e; }

        .terminal-input-line {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-green);
        }

        .terminal-input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            flex-grow: 1;
        }

        .scroll-hint {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }
        .scroll-hint:hover { color: var(--accent-cyan); }

        /* 下滑后的博客/笔记区域 */
        .blog-section {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 24px 120px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 32px;
        }

        .sidebar {
            position: sticky;
            top: 32px;
            height: fit-content;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
        }

        .sidebar-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .note-list { list-style: none; }
        .note-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 6px;
            border-left: 2px solid transparent;
        }
        .note-item:hover { background: rgba(255, 255, 255, 0.05); }
        .note-item.active {
            background: rgba(0, 240, 255, 0.1);
            border-left: 2px solid var(--accent-cyan);
        }
        .note-item-title { font-size: 0.95rem; font-weight: 600; color: var(--text-main); }
        .note-item-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .article-viewer {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 40px 48px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            min-height: 600px;
        }

        /* Markdown 样式 */
        .markdown-body h1 { font-size: 2rem; margin-bottom: 12px; color: #fff; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 16px; }
        .markdown-body h2 { font-size: 1.4rem; color: var(--accent-cyan); margin: 32px 0 16px; font-family: 'JetBrains Mono', monospace; }
        .markdown-body h3 { font-size: 1.15rem; margin: 24px 0 12px; color: #fff; }
        .markdown-body p { margin-bottom: 16px; color: #cbd5e1; }
        .markdown-body code { font-family: 'JetBrains Mono', monospace; background: rgba(0, 240, 255, 0.1); color: var(--accent-cyan); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        .markdown-body pre { background: #0d1117 !important; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 16px; overflow-x: auto; margin: 20px 0; }
        .markdown-body pre code { background: none; color: inherit; padding: 0; }
        .markdown-body blockquote { border-left: 3px solid var(--accent-purple); background: rgba(189, 0, 255, 0.06); padding: 12px 20px; border-radius: 0 8px 8px 0; margin: 20px 0; color: #d8b4fe; }
        .katex-display { overflow-x: auto; padding: 12px 0; margin: 20px 0 !important; background: rgba(0, 0, 0, 0.25); border-radius: 8px; border: 1px standard rgba(255, 255, 255, 0.05); }

        @media (max-width: 860px) {
            .blog-section { grid-template-columns: 1fr; }
            .sidebar { position: static; }
            .article-viewer { padding: 24px; }
            .terminal-box { max-width: 95vw; }
        }
    </style>
</head>
<body>

    <canvas id="cyber-canvas"></canvas>

    <!-- 首屏：互动终端区 -->
    <section class="hero">
        <div class="terminal-box">
            <div class="terminal-header">
                <div class="terminal-dots">
                    <div class="dot dot-red"></div>
                    <div class="dot dot-yellow"></div>
                    <div class="dot dot-green"></div>
                </div>
                <div class="terminal-title">guest@github.io:~ (bash)</div>
            </div>
            <div class="terminal-body" id="terminal-body">
                <div class="terminal-output">欢迎来到我的极客主页！
输入 <span class="highlight-cmd">help</span> 查看可用指令，输入 <span class="highlight-cmd">tree</span> 查看仓库结构。</div>
                <div id="terminal-history"></div>
            </div>
            <div style="padding: 0 20px 16px; background: rgba(10, 14, 22, 0.85); border-top: 1px solid rgba(255,255,255,0.03);">
                <div class="terminal-input-line">
                    <span>➜</span>
                    <span style="color: var(--accent-cyan);">~</span>
                    <input type="text" id="terminal-input" class="terminal-input" autofocus autocomplete="off" spellcheck="false" placeholder="输入 help 或 tree ...">
                </div>
            </div>
        </div>

        <a href="#notes-container" class="scroll-hint">
            <span>向下滚动加载 LaTeX 笔记存档</span>
            <span>↓</span>
        </a>
    </section>

    <!-- 下滑：博客与笔记区域 -->
    <main id="notes-container" class="blog-section">
        <aside class="sidebar">
            <div class="sidebar-title">// 笔记目录</div>
            <ul class="note-list" id="note-list"></ul>
        </aside>
        <article class="article-viewer">
            <div id="markdown-content" class="markdown-body"></div>
        </article>
    </main>

    <script>
        /* =========================================================
         * 1. 笔记内容与数据配置 (你以后主要在这里加文章)
         * ========================================================= */
        const NOTES_DATA = [
            {
                id: "note-1",
                title: "Information Bottleneck & Representation",
                date: "2026-11-03",
                tag: "Theory",
                content: `# Information Bottleneck & Parsimonious Representation

在表示学习（Representation Learning）中，我们希望从高维观测数据 $X \\in \\mathbb{R}^D$ 中提取低维紧致特征 $Z \\in \\mathbb{R}^d$（其中 $d \\ll D$），使得 $Z$ 最大限度保留关于目标变量 $Y$ 的预测信息，同时剔除冗余噪声。

## 1. 变分信息瓶颈 (Variational Information Bottleneck)

信息瓶颈（IB）的目标函数定义为最大化互信息项与压缩正则项的权衡：

$$
\\mathcal{L}_{\\text{IB}}(\\theta) = I(Z; Y) - \\beta I(Z; X)
$$

其中 $\\beta > 0$ 为控制压缩率与任务表征能力的拉格朗日乘子。利用变分下界，转化为可微分损失：

$$
\\mathcal{L}_{\\text{VIB}} = \\mathbb{E}_{q_\\theta(z|x)} [\\log p_\\phi(y|z)] - \\beta \\, D_{\\text{KL}}\\left(q_\\theta(z|x) \\,\\|\\, r(z)\\right)
$$
`
            },
            {
                id: "note-2",
                title: "Optimization & Newton-Raphson Dynamics",
                date: "2026-10-28",
                tag: "Math",
                content: `# Numerical Optimization in Logistic Regression

考虑二分类对数几率回归，条件概率由 Sigmoid 函数给出：

$$
p(y_i = 1 \\mid x_i; w) = \\sigma(w^\\top x_i) = \\frac{1}{1 + e^{-w^\\top x_i}}
$$

二阶海森矩阵 (Hessian Matrix)：

$$
H(w) = X^\\top S X
$$
`
            }
        ];

        /* =========================================================
         * 2. 互动终端 (Web Terminal) 逻辑
         * ========================================================= */
        const terminalHistory = document.getElementById('terminal-history');
        const terminalInput = document.getElementById('terminal-input');
        const terminalBody = document.getElementById('terminal-body');

        const repoStructure = `├── index.html            # 主页单文件 (Canvas特效 + 终端 + LaTeX渲染)
├── README.md             # 仓库介绍文档
├── assets/               # 静态资源与图片目录
│   ├── avatar.png
│   └── banner.png
└── posts/                # Markdown 笔记存档目录
    ├── note-1.md
    └── note-2.md`;

        const helpText = `可用命令列表：
  tree         - 查看 GitHub 仓库目录结构
  cat readme   - 查看个人简介与研究方向
  cat notes    - 滚动到下方查看 LaTeX 笔记列表
  whoami       - 查看当前访客身份
  clear        - 清空当前终端屏幕
  help         - 显示此帮助信息`;

        const aboutText = `【个人简介 / About Me】
- 身份：AI 与多模态表示学习研究者
- 核心方向：第一性原理理论、变分信息瓶颈、统一多模态模型
- 编程栈：Python, PyTorch, C++, Web`;

        function appendToTerminal(cmd, output, isHtml = false) {
            const div = document.createElement('div');
            div.style.marginBottom = '8px';
            div.innerHTML = `<div><span style="color:var(--accent-green)">➜</span> <span style="color:var(--accent-cyan)">~</span> <span style="color:#fff">${cmd}</span></div>`;
            
            const outDiv = document.createElement('div');
            outDiv.className = 'terminal-output';
            if (isHtml) {
                outDiv.innerHTML = output;
            } else {
                outDiv.textContent = output;
            }
            div.appendChild(outDiv);
            terminalHistory.appendChild(div);
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        terminalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = terminalInput.value.trim();
                terminalInput.value = '';

                if (cmd === '') return;

                if (cmd === 'clear') {
                    terminalHistory.innerHTML = '';
                    return;
                }

                let response = '';
                let isHtml = false;

                switch(cmd.toLowerCase()) {
                    case 'help':
                        response = helpText;
                        break;
                    case 'tree':
                        response = repoStructure;
                        break;
                    case 'cat readme':
                    case 'cat about':
                        response = aboutText;
                        break;
                    case 'whoami':
                        response = "guest@github-researcher-node-01 (Authorized)";
                        break;
                    case 'cat notes':
                        response = "正在跳转至 LaTeX 笔记区...";
                        document.getElementById('notes-container').scrollIntoView({ behavior: 'smooth' });
                        break;
                    case 'ls':
                    case 'dir':
                        response = "index.html    README.md    assets/    posts/";
                        break;
                    default:
                        response = `bash: ${cmd}: command not found. Type 'help' for available commands.`;
                }

                appendToTerminal(cmd, response, isHtml);
            }
        });

        /* =========================================================
         * 3. 笔记渲染与切换核心
         * ========================================================= */
        const noteListEl = document.getElementById('note-list');
        const contentEl = document.getElementById('markdown-content');

        async function loadNote(index) {
            document.querySelectorAll('.note-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            const note = NOTES_DATA[index];
            let rawMarkdown = note.content;

            const mathBlocks = [];
            const protectedMd = rawMarkdown.replace(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$)/g, (match) => {
                mathBlocks.push(match);
                return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
            });

            let html = marked.parse(protectedMd);
            html = html.replace(/@@MATH_BLOCK_(\d+)@@/g, (_, idx) => mathBlocks[Number(idx)]);
            contentEl.innerHTML = html;

            document.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));

            if (window.renderMathInElement) {
                renderMathInElement(contentEl, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false
                });
            }
        }

        NOTES_DATA.forEach((note, index) => {
            const li = document.createElement('li');
            li.className = 'note-item';
            li.innerHTML = `
                <div class="note-item-title">${note.title}</div>
                <div class="note-item-meta">[${note.tag}] · ${note.date}</div>
            `;
            li.onclick = () => loadNote(index);
            noteListEl.appendChild(li);
        });

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => loadNote(0), 100);
        });

        /* =========================================================
         * 4. 炫彩粒子鼠标 Canvas 动效
         * ========================================================= */
        const canvas = document.getElementById('cyber-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles;
        let hue = 185;

        const mouse = { x: -1000, y: -1000, radius: 160 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseout', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.1;
                this.vy = (Math.random() - 0.5) * 1.1;
                this.size = Math.random() * 2 + 1;
                this.colorOffset = Math.random() * 60;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < mouse.radius) {
                    const force = (mouse.radius - dist) / mouse.radius;
                    this.x += (dx / dist) * force * 2.2;
                    this.y += (dy / dist) * force * 2.2;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${(hue + this.colorOffset) % 360}, 100%, 65%)`;
                ctx.fill();
            }
        }

        function initParticles() {
            const count = Math.min(Math.floor((width * height) / 11000), 130);
            particles = Array.from({ length: count }, () => new Particle());
        }

        function animate() {
            ctx.fillStyle = 'rgba(7, 9, 14, 0.28)';
            ctx.fillRect(0, 0, width, height);

            hue = (hue + 0.35) % 360;

            if (mouse.x > 0) {
                const grad = ctx.createRadialGradient(mouse.x, mouse.y, 2, mouse.x, mouse.y, 180);
                grad.addColorStop(0, `hsla(${hue}, 100%, 60%, 0.18)`);
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 180, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 125) {
                        const alpha = (1 - dist / 125) * 0.45;
                        ctx.strokeStyle = `hsla(${(hue + particles[i].colorOffset) % 360}, 100%, 65%, ${alpha})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
