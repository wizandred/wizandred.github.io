<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEBU8GR // GEEK TERMINAL</title>
    
    <!-- 引入极客等宽字体 -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,500;0,700;1,400&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- 引入 KaTeX (LaTeX 渲染引擎) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- 引入 Marked.js 与代码高亮 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(12, 16, 25, 0.85);
            --border-glow: rgba(0, 240, 255, 0.25);
            --accent-cyan: #00f0ff;
            --accent-green: #27c93f;
            --accent-purple: #bd00ff;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            overflow-x: hidden;
            line-height: 1.6;
        }

        #cyber-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* 首屏全屏终端容器 */
        .hero {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .terminal-window {
            width: 100%;
            max-width: 800px;
            background: rgba(5, 8, 13, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.12), inset 0 0 20px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 仿照图片的炫酷发光像素名横幅 */
        .pixel-banner-box {
            padding: 30px 20px 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(0,240,255,0.05) 0%, transparent 100%);
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .pixel-name {
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, #ff5f56 0%, #ffbd2e 35%, #27c93f 70%, #00f0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            filter: drop-shadow(3px 3px 0px rgba(189, 0, 255, 0.3));
        }

        .sub-banner-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 1px;
        }
        .sub-banner-text span { color: var(--accent-cyan); }

        /* 终端主体滚动区域 */
        .terminal-body {
            padding: 24px;
            height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.9rem;
        }

        .access-granted {
            color: var(--accent-green);
            font-weight: bold;
            text-shadow: 0 0 10px rgba(39, 201, 63, 0.4);
            margin-bottom: 4px;
        }

        .terminal-output {
            color: var(--text-muted);
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .cmd-prompt {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .terminal-input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            flex-grow: 1;
        }

        .scroll-hint {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }
        .scroll-hint:hover { color: var(--accent-cyan); }

        /* 下滑后的 LaTeX 笔记板块 */
        .blog-section {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 24px 120px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 32px;
        }

        .sidebar {
            position: sticky;
            top: 32px;
            height: fit-content;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 20px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .note-list { list-style: none; }
        .note-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 6px;
            border-left: 2px solid transparent;
        }
        .note-item:hover { background: rgba(255, 255, 255, 0.05); }
        .note-item.active {
            background: rgba(0, 240, 255, 0.1);
            border-left: 2px solid var(--accent-cyan);
        }
        .note-item-title { font-size: 0.9rem; font-weight: 600; color: var(--text-main); font-family: 'Inter', sans-serif; }
        .note-item-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

        .article-viewer {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 40px 48px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            min-height: 600px;
            font-family: 'Inter', sans-serif;
        }

        /* Markdown & LaTeX 排版 */
        .markdown-body h1 { font-size: 1.8rem; margin-bottom: 12px; color: #fff; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 12px; }
        .markdown-body h2 { font-size: 1.3rem; color: var(--accent-cyan); margin: 28px 0 14px; font-family: 'JetBrains Mono', monospace; }
        .markdown-body p { margin-bottom: 14px; color: #cbd5e1; line-height: 1.7; }
        .markdown-body code { font-family: 'JetBrains Mono', monospace; background: rgba(0, 240, 255, 0.1); color: var(--accent-cyan); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        .markdown-body pre { background: #0d1117 !important; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; padding: 16px; overflow-x: auto; margin: 20px 0; }
        .markdown-body pre code { background: none; color: inherit; padding: 0; }
        .markdown-body blockquote { border-left: 3px solid var(--accent-purple); background: rgba(189, 0, 255, 0.06); padding: 12px 16px; border-radius: 0 6px 6px 0; margin: 20px 0; color: #d8b4fe; }
        .katex-display { overflow-x: auto; padding: 10px 0; margin: 16px 0 !important; background: rgba(0, 0, 0, 0.25); border-radius: 6px; }

        @media (max-width: 860px) {
            .blog-section { grid-template-columns: 1fr; }
            .sidebar { position: static; }
            .article-viewer { padding: 24px; }
            .terminal-window { max-width: 95vw; }
        }
    </style>
</head>
<body>

    <canvas id="cyber-canvas"></canvas>

    <section class="hero">
        <div class="terminal-window">
            <!-- 像素艺术风的名字展示区（可在下方修改文字） -->
            <div class="pixel-banner-box">
                <div class="pixel-name">DEBU8GR</div>
                <div class="sub-banner-text">root@debu8gr:<span>~</span> am // rootkit active</div>
            </div>

            <!-- 终端交互输出区 -->
            <div class="terminal-body" id="terminal-body">
                <div class="access-granted">[ACCESS GRANTED] root@debu8gr:~$ ./blog --boot --theme=terminal</div>
                <div class="terminal-output">type <span style="color:var(--accent-cyan)">help</span> to list commands</div>
                <div id="terminal-history"></div>
            </div>

            <!-- 命令行输入区 -->
            <div class="cmd-prompt">
                <span style="color: var(--accent-green)">guest@visitor:~$</span>
                <input type="text" id="terminal-input" class="terminal-input" autofocus autocomplete="off" spellcheck="false" placeholder="输入 help 或 ls 查看路由...">
            </div>
        </div>

        <a href="#notes-container" class="scroll-hint">
            <span>↓ 向下滚动进入 LaTeX 笔记存档</span>
        </a>
    </section>

    <!-- 下滑：LaTeX 笔记专区 -->
    <main id="notes-container" class="blog-section">
        <aside class="sidebar">
            <div class="sidebar-title">// 目录 / Routes</div>
            <ul class="note-list" id="note-list"></ul>
        </aside>
        <article class="article-viewer">
            <div id="markdown-content" class="markdown-body"></div>
        </article>
    </main>

    <script>
        /* =========================================================
         * 1. 笔记数据存放区
         * ========================================================= */
        const NOTES_DATA = [
            {
                title: "Information Bottleneck & Representation",
                date: "2026-11-03",
                tag: "Theory",
                content: `# Information Bottleneck & Parsimonious Representation

在表示学习中，我们希望从高维观测数据 $X \\in \\mathbb{R}^D$ 中提取低维紧致特征 $Z \\in \\mathbb{R}^d$，使得 $Z$ 最大限度保留关于目标变量 $Y$ 的预测信息。

## 1. 变分信息瓶颈目标函数

$$
\\mathcal{L}_{\\text{IB}}(\\theta) = I(Z; Y) - \\beta I(Z; X)
$$

利用变分下界转化为可优化损失：

$$
\\mathcal{L}_{\\text{VIB}} = \\mathbb{E}_{q_\\theta(z|x)} [\\log p_\\phi(y|z)] - \\beta \\, D_{\\text{KL}}\\left(q_\\theta(z|x) \\,\\|\\, r(z)\\right)
$$
`
            },
            {
                title: "Newton-Raphson Optimization Dynamics",
                date: "2026-10-28",
                tag: "Math",
                content: `# Numerical Optimization in Logistic Regression

二分类条件概率由 Sigmoid 函数给出：

$$
p(y_i = 1 \\mid x_i; w) = \\sigma(w^\\top x_i) = \\frac{1}{1 + e^{-w^\\top x_i}}
$$

二阶海森矩阵 (Hessian Matrix)：

$$
H(w) = X^\\top S X
$$
`
            }
        ];

        /* =========================================================
         * 2. 终端交互逻辑
         * ========================================================= */
        const terminalHistory = document.getElementById('terminal-history');
        const terminalInput = document.getElementById('terminal-input');
        const terminalBody = document.getElementById('terminal-body');

        const routesText = `routes:
  /home
  /posts (支持 LaTeX 渲染)
  /archives
  /categories
  /tags
  /about`;

        const helpText = `可用命令列表：
  help         - 显示帮助信息
  ls           - 列出所有路由板块
  cat readme   - 查看个人简介
  cat notes    - 平滑滚动到下方查看 LaTeX 笔记
  clear        - 清空终端屏幕`;

        const aboutText = `[ABOUT ME]
- ID: DEBU8GR
- Focus: Multimodal Models & First-Principles Theory
- Status: Hacking & Researching`;

        function appendToTerminal(cmd, output) {
            const div = document.createElement('div');
            div.style.marginBottom = '8px';
            div.innerHTML = `<span style="color:var(--accent-green)">guest@visitor:~$</span> <span style="color:#fff">${cmd}</span>`;
            
            const outDiv = document.createElement('div');
            outDiv.className = 'terminal-output';
            outDiv.textContent = output;
            div.appendChild(outDiv);
            terminalHistory.appendChild(div);
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        terminalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = terminalInput.value.trim();
                terminalInput.value = '';
                if (cmd === '') return;

                if (cmd === 'clear') {
                    terminalHistory.innerHTML = '';
                    return;
                }

                let response = '';
                switch(cmd.toLowerCase()) {
                    case 'help':
                        response = helpText;
                        break;
                    case 'ls':
                    case 'dir':
                        response = routesText;
                        break;
                    case 'cat readme':
                    case 'cat about':
                        response = aboutText;
                        break;
                    case 'cat notes':
                    case '/posts':
                        response = "正在跳转至 LaTeX 笔记区...";
                        document.getElementById('notes-container').scrollIntoView({ behavior: 'smooth' });
                        break;
                    case 'hello':
                        response = "Hello, hacker! Welcome to my site.";
                        break;
                    default:
                        response = `command not found: ${cmd}. try 'help'`;
                }
                appendToTerminal(cmd, response);
            }
        });

        /* =========================================================
         * 3. 笔记渲染逻辑
         * ========================================================= */
        const noteListEl = document.getElementById('note-list');
        const contentEl = document.getElementById('markdown-content');

        async function loadNote(index) {
            document.querySelectorAll('.note-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            const note = NOTES_DATA[index];
            let rawMarkdown = note.content;

            const mathBlocks = [];
            const protectedMd = rawMarkdown.replace(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$)/g, (match) => {
                mathBlocks.push(match);
                return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
            });

            let html = marked.parse(protectedMd);
            html = html.replace(/@@MATH_BLOCK_(\d+)@@/g, (_, idx) => mathBlocks[Number(idx)]);
            contentEl.innerHTML = html;

            document.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));

            if (window.renderMathInElement) {
                renderMathInElement(contentEl, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false
                });
            }
        }

        NOTES_DATA.forEach((note, index) => {
            const li = document.createElement('li');
            li.className = 'note-item';
            li.innerHTML = `
                <div class="note-item-title">${note.title}</div>
                <div class="note-item-meta">[${note.tag}] · ${note.date}</div>
            `;
            li.onclick = () => loadNote(index);
            noteListEl.appendChild(li);
        });

        window.addEventListener('DOMContentLoaded', () => setTimeout(() => loadNote(0), 100));

        /* =========================================================
         * 4. 炫彩鼠标 Canvas 背景动效（保留）
         * ========================================================= */
        const canvas = document.getElementById('cyber-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles;
        let hue = 185;
        const mouse = { x: -1000, y: -1000, radius: 160 };

        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseout', () => { mouse.x = -1000; mouse.y = -1000; });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.1;
                this.vy = (Math.random() - 0.5) * 1.1;
                this.size = Math.random() * 2 + 1;
                this.colorOffset = Math.random() * 60;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                const dx = mouse.x - this.x, dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < mouse.radius) {
                    const force = (mouse.radius - dist) / mouse.radius;
                    this.x += (dx / dist) * force * 2.2;
                    this.y += (dy / dist) * force * 2.2;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${(hue + this.colorOffset) % 360}, 100%, 65%)`;
                ctx.fill();
            }
        }

        function initParticles() {
            const count = Math.min(Math.floor((width * height) / 11000), 130);
            particles = Array.from({ length: count }, () => new Particle());
        }

        function animate() {
            ctx.fillStyle = 'rgba(7, 9, 14, 0.28)';
            ctx.fillRect(0, 0, width, height);
            hue = (hue + 0.35) % 360;

            if (mouse.x > 0) {
                const grad = ctx.createRadialGradient(mouse.x, mouse.y, 2, mouse.x, mouse.y, 180);
                grad.addColorStop(0, `hsla(${hue}, 100%, 60%, 0.18)`);
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 180, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 125) {
                        const alpha = (1 - dist / 125) * 0.45;
                        ctx.strokeStyle = `hsla(${(hue + particles[i].colorOffset) % 360}, 100%, 65%, ${alpha})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
