    <style>

        /* 移动端/窄屏降级适配 */
        @media (max-width: 1024px) {

            .blog-section { grid-template-columns: 1fr; }

    <script>
        /* =========================================================
         * 模块 1：配置你的笔记数据（支持直接内联或填写外部 .md 文件路径）
         * ========================================================= */
        const NOTES_DATA = [
            {
                id: "note-1",
                title: "Information Bottleneck & Representation",
                date: "2026-11-03",
                tag: "Theory",
                // 如果你在仓库新建了 posts/note1.md，只需写 file: "posts/note1.md"
                content: `# Information Bottleneck & Parsimonious Representation

在表示学习（Representation Learning）中，我们希望从高维观测数据 $X \\in \\mathbb{R}^D$ 中提取低维紧致特征 $Z \\in \\mathbb{R}^d$（其中 $d \\ll D$），使得 $Z$ 最大限度保留关于目标变量 $Y$ 的预测信息，同时剔除冗余噪声。

## 1. 变分信息瓶颈 (Variational Information Bottleneck)

信息瓶颈（IB）的目标函数定义为最大化互信息项与压缩正则项的权衡：

$$
\\mathcal{L}_{\\text{IB}}(\\theta) = I(Z; Y) - \\beta I(Z; X)
$$

其中 $\\beta > 0$ 为控制压缩率与任务表征能力的拉格朗日乘子。利用变分下界（Variational Lower Bound），我们可以将上式转化为可微分的损失函数：

$$
\\mathcal{L}_{\\text{VIB}} = \\mathbb{E}_{q_\\theta(z|x)} [\\log p_\\phi(y|z)] - \\beta \\, D_{\\text{KL}}\\left(q_\\theta(z|x) \\,\\|\\, r(z)\\right)
$$

> **核心直觉**：当编码分布 $q_\\theta(z|x)$ 趋向于先验分布 $r(z) = \\mathcal{N}(0, I)$ 时，特征空间满足最小充分统计量（Minimal Sufficient Statistic）性质。

## 2. 编码率缩减 (Coding Rate Reduction)

对于无监督与自监督场景，给定特征矩阵 $Z = [z_1, z_2, \\dots, z_m] \\in \\mathbb{R}^{d \\times m}$，在高斯失真度 $\\epsilon^2$ 下所需的平均比特数（Coding Rate）可由以下行列式解析表达：

$$
R(Z, \\epsilon) = \\frac{1}{2} \\log \\det \\left( I + \\frac{d}{m \\epsilon^2} Z Z^\\top \\right)
$$

\`\`\`python
import torch

def coding_rate(Z: torch.Tensor, eps: float = 0.1) -> torch.Tensor:
    """计算特征矩阵 Z 的编码率 R(Z, eps)"""
    m, d = Z.shape
    I = torch.eye(d, device=Z.device)
    cov = (d / (m * eps ** 2)) * (Z.T @ Z)
    return 0.5 * torch.logdet(I + cov)
\`\`\`
`
            },
            {
                id: "note-2",
                title: "Optimization & Newton-Raphson Dynamics",
                date: "2026-10-28",
                tag: "Math",
                content: `# Numerical Optimization in Logistic Regression

考虑二分类对数几率回归，给定数据集 $\\{(x_i, y_i)\\}_{i=1}^N$，其中 $y_i \\in \\{0, 1\\}$，条件概率由 Sigmoid 函数给出：

$$
p(y_i = 1 \\mid x_i; w) = \\sigma(w^\\top x_i) = \\frac{1}{1 + e^{-w^\\top x_i}}
$$

## 二阶海森矩阵 (Hessian Matrix) 推导

负对数似然损失函数（交叉熵）写为：

$$
\\ell(w) = -\\sum_{i=1}^N \\left[ y_i \\log \\mu_i + (1 - y_i) \\log(1 - \\mu_i) \\right], \\quad \\mu_i = \\sigma(w^\\top x_i)
$$

对其求一阶梯度 $\\nabla \\ell(w)$ 与二阶海森矩阵 $H(w) = \\nabla^2 \\ell(w)$：

$$
\\nabla \\ell(w) = X^\\top (\\mu - y), \\qquad H(w) = X^\\top S X
$$

其中对角权重矩阵 $S = \\text{diag}(\\mu_1(1-\\mu_1), \\dots, \\mu_N(1-\\mu_N))$ 正定，保证了目标函数严格凸性，牛顿法迭代更新公式即等价于迭代重加权最小二乘（IRLS）：

$$
w^{(t+1)} = w^{(t)} - \\left(X^\\top S^{(t)} X\\right)^{-1} X^\\top (\\mu^{(t)} - y)
$$
`
            }
        ];

        /* =========================================================
         * 模块 2：渲染笔记列表与 LaTeX 公式
         * ========================================================= */
        const noteListEl = document.getElementById('note-list');
        const contentEl = document.getElementById('markdown-content');

        async function loadNote(index) {
            // 更新选中状态
            document.querySelectorAll('.note-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            const note = NOTES_DATA[index];
            let rawMarkdown = note.content;

            // 如果配置了外部 .md 文件路径，则通过 fetch 拉取仓库里的 .md 文件
            if (note.file) {
                try {
                    const res = await fetch(note.file);
                    rawMarkdown = await res.text();
                } catch (e) {
                    rawMarkdown = `# Error Loading File\n无法读取 \`${note.file}\`，请确认文件路径是否正确。`;
                }
            }

            // 保护 LaTeX 公式不被 Marked.js 破坏下划线和星号
            const mathBlocks = [];
            const protectedMd = rawMarkdown.replace(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$)/g, (match) => {
                mathBlocks.push(match);
                return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
            });

            // 解析 Markdown
            let html = marked.parse(protectedMd);

            // 还原 LaTeX 块
            html = html.replace(/@@MATH_BLOCK_(\d+)@@/g, (_, idx) => mathBlocks[Number(idx)]);
            contentEl.innerHTML = html;

            // 语法高亮
            document.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));

            // 渲染 KaTeX 数学公式
            if (window.renderMathInElement) {
                renderMathInElement(contentEl, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false
                });
            }
        }

        // 初始化左侧菜单
        NOTES_DATA.forEach((note, index) => {
            const li = document.createElement('li');
            li.className = 'note-item';
            li.innerHTML = `
                <div class="note-item-title">${note.title}</div>
                <div class="note-item-meta">[${note.tag}] · ${note.date}</div>
            `;
            li.onclick = () => loadNote(index);
            noteListEl.appendChild(li);
        });

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => loadNote(0), 100);
        });

        /* =========================================================
         * 模块 3：炫彩科技感鼠标跟随粒子网络 (HTML5 Canvas)
         * ========================================================= */
        const canvas = document.getElementById('cyber-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles;
        let hue = 185; // 初始青色色相

        const mouse = { x: -1000, y: -1000, radius: 160 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseout', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.1;
                this.vy = (Math.random() - 0.5) * 1.1;
                this.size = Math.random() * 2 + 1;
                this.colorOffset = Math.random() * 60;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // 鼠标交互：引力吸附 + 能量高亮
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < mouse.radius) {
                    const force = (mouse.radius - dist) / mouse.radius;
                    this.x += (dx / dist) * force * 2.2;
                    this.y += (dy / dist) * force * 2.2;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${(hue + this.colorOffset) % 360}, 100%, 65%)`;
                ctx.fill();
            }
        }

        function initParticles() {
            const count = Math.min(Math.floor((width * height) / 11000), 130);
            particles = Array.from({ length: count }, () => new Particle());
        }

        function animate() {
            // 制造轻微拖尾流光感
            ctx.fillStyle = 'rgba(7, 9, 14, 0.28)';
            ctx.fillRect(0, 0, width, height);

            hue = (hue + 0.35) % 360; // 动态流光变色

            // 鼠标光晕中心
            if (mouse.x > 0) {
                const grad = ctx.createRadialGradient(mouse.x, mouse.y, 2, mouse.x, mouse.y, 180);
                grad.addColorStop(0, `hsla(${hue}, 100%, 60%, 0.18)`);
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 180, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                // 粒子间神经网络连线
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 125) {
                        const alpha = (1 - dist / 125) * 0.45;
                        ctx.strokeStyle = `hsla(${(hue + particles[i].colorOffset) % 360}, 100%, 65%, ${alpha})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }

                // 粒子与鼠标的激光连线
                const mDx = particles[i].x - mouse.x;
                const mDy = particles[i].y - mouse.y;
                const mDist = Math.sqrt(mDx * mDx + mDy * mDy);
                if (mDist < mouse.radius) {
                    const alpha = (1 - mDist / mouse.radius) * 0.85;
                    ctx.strokeStyle = `hsla(${(hue + 40) % 360}, 100%, 70%, ${alpha})`;
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.stroke();
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
